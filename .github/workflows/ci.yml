name: Build, check & publish

# The site for www.ziglang.in/raylib/. Every run builds it from raylib-zig at
# one commit: the browser builds of the examples come from raylib-zig-port's
# `web-latest` release (its CI publishes them only when its browser gate
# passed), and the sources, API data and gate lists come from a checkout of
# raylib-zig-port at the commit that release names. Then the getting-started
# project is built as a reader would, the site is built and checked in
# headless Chrome, and on main the result is pushed to the `site` branch as an
# orphan commit. ziglang.in's deploy (06:00 UTC nightly) copies it into /raylib/.
on:
  push:
    branches: [main]
    # Session notes do not change the site.
    paths-ignore: [handoff.md, tokens.txt, AGENTS.md, CLAUDE.md]
  pull_request:
  schedule:
    - cron: "30 5 * * *" # 05:30 UTC: picks up raylib-zig's newest release before ziglang.in's deploy
  workflow_dispatch:

permissions:
  contents: write # the site branch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same as raylib-zig's own CI (its .github/workflows/web.yml).
  ZIG_VERSION: 0.18.0-dev.246+05671ced9
  RAYLIB_TAG: "6.2"
  # One place for the address, for both the build and the browser check.
  BASE_PATH: /raylib/
  SITE_URL: https://www.ziglang.in
  RAYLIB_ZIG: ${{ github.workspace }}/.ci/raylib-zig

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: raylib-zig browser builds (web-latest release)
        id: web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download web-latest -R algorisys-oss/raylib-zig-port -D "$RUNNER_TEMP/web"
          cat "$RUNNER_TEMP/web/MANIFEST" >> "$GITHUB_STEP_SUMMARY"
          echo "commit=$(sed -n 's/^commit=//p' "$RUNNER_TEMP/web/MANIFEST")" >> "$GITHUB_OUTPUT"

      # The commit the browser builds were made from, so the sources shown, the
      # API reference and the verification marks match what was gated.
      - uses: actions/checkout@v7
        with:
          repository: algorisys-oss/raylib-zig-port
          ref: ${{ steps.web.outputs.commit }}
          path: .ci/raylib-zig

      - name: Unpack the browser builds
        run: |
          mkdir -p "$RAYLIB_ZIG/zig-out"
          tar -C "$RAYLIB_ZIG/zig-out" -xzf "$RUNNER_TEMP/web/raylib-zig-web.tar.gz"

      - name: raylib ${{ env.RAYLIB_TAG }} (the C examples shown next to the Zig)
        run: |
          git clone --depth 1 --branch "$RAYLIB_TAG" https://github.com/raysan5/raylib "$RUNNER_TEMP/raylib"
          echo "RAYLIB_EXAMPLES=$RUNNER_TEMP/raylib/examples" >> "$GITHUB_ENV"

      # The getting-started page's own list of packages: installing exactly
      # these is part of checking that the page is right.
      - name: System packages (as on the Getting started page)
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev

      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Dependencies and headless Chrome
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # sync, getting-started check, astro build, e2e; then the push on main.
      - name: Build and check (pull requests and branches)
        if: github.ref != 'refs/heads/main'
        run: tools/publish-site.sh --dry-run

      - name: Build, check and publish the site branch (main)
        if: github.ref == 'refs/heads/main'
        env:
          PUBLISH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: tools/publish-site.sh
